name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Valid Manifest
        run: |
          P="android"
          mkdir -p app/src/main
          printf '<?xml version="1.0" encoding="utf-8"?>\n' > app/src/main/AndroidManifest.xml
          printf '<manifest xmlns:%s="http://android.com">\n' "$P" >> app/src/main/AndroidManifest.xml
          printf '  <uses-permission %s:name="android.permission.INTERNET" />\n' "$P" >> app/src/main/AndroidManifest.xml
          printf '  <application %s:label="QwenPaw" %s:usesCleartextTraffic="true" %s:theme="@android:style/Theme.Material.Light.NoActionBar">\n' "$P" "$P" "$P" >> app/src/main/AndroidManifest.xml
          printf '    <activity %s:name=".MainActivity" %s:exported="true">\n' "$P" "$P" >> app/src/main/AndroidManifest.xml
          printf '      <intent-filter>\n' >> app/src/main/AndroidManifest.xml
          printf '        <action %s:name="android.intent.action.MAIN" />\n' "$P" >> app/src/main/AndroidManifest.xml
          printf '        <category %s:name="android.intent.category.LAUNCHER" />\n' "$P" >> app/src/main/AndroidManifest.xml
          printf '      </intent-filter>\n' >> app/src/main/AndroidManifest.xml
          printf '    </activity>\n' >> app/src/main/AndroidManifest.xml
          printf '  </application>\n' >> app/src/main/AndroidManifest.xml
          printf '</manifest>\n' >> app/src/main/AndroidManifest.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
